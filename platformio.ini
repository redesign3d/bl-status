# platformio.ini
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  adafruit/Adafruit NeoPixel
  bblanchon/ArduinoJson
  knolleary/PubSubClient

build_flags =
  -DMQTT_MAX_PACKET_SIZE=4096
  -DMQTT_KEEPALIVE=30
  -DMQTT_VERSION=MQTT_VERSION_3_1_1

# Generate a header with the printer root CA from the default Mac path (or env override)
extra_scripts = scripts/embed_cert.py

[env]
; Override certificate path if needed:
; env defaults:
;   BAMBU_CERT_PATH (env var) or ~/Applications/BambuStudio.app/Contents/Resources/cert/printer.cer
